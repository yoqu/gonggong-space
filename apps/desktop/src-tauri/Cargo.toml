[package]
name = "gonggong-desktop"
version = "0.1.0"
edition = "2024"
description = "Gonggong desktop app"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gonggong = { path = "../../../crates/gonggong" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
