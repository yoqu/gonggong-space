<!doctype html>
<!-- gg-kit shell: platform-owned. Copied verbatim to design/<slug>/index.html; never edit. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; background: #ececef; color: #1d1d1f;
    font: 13px/1.4 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft Yahei", sans-serif;
  }
  [hidden] { display: none !important; }
  header {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: #fff; border-bottom: 1px solid #dcdce0; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: #f0f0f2; }
  .seg button { border: 0; background: none; border-radius: 6px; padding: 3px 12px; font: inherit; color: #6e6e73; cursor: pointer; }
  .seg button[aria-pressed='true'] { background: #fff; color: #1d1d1f; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .tools { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .tools button {
    border: 1px solid #d2d2d7; background: #fff; border-radius: 999px; padding: 3px 12px;
    font: inherit; color: inherit; cursor: pointer;
  }
  .tools button[aria-current] { background: #1d1d1f; border-color: #1d1d1f; color: #fff; }
  .tools button:disabled { opacity: 0.4; cursor: default; }
  .zoom { min-width: 48px; text-align: center; color: #6e6e73; font-variant-numeric: tabular-nums; }
  main { position: relative; flex: 1; min-height: 0; overflow: hidden; }

  /* canvas */
  .canvas { position: absolute; inset: 0; cursor: grab; touch-action: none;
    background: radial-gradient(circle, #d4d4d9 1px, transparent 1px) 0 0 / 24px 24px; }
  .canvas.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .links path { fill: none; stroke: #8e8e93; stroke-width: 2; stroke-dasharray: 6 5; }
  .frame { position: absolute; }
  .label {
    position: absolute; left: 0; right: 0; bottom: 100%; display: flex; align-items: center; gap: 8px;
    height: 40px; font-size: 18px; font-weight: 600; color: #3a3a3c; white-space: nowrap;
  }
  .label button {
    border: 0; border-radius: 999px; padding: 2px 10px; background: #fff; color: #1d1d1f;
    font: 13px/20px inherit; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .frame .device { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08), 0 16px 40px rgba(0, 0, 0, 0.12); transition: box-shadow 0.3s; }
  .frame.focus .device { box-shadow: 0 0 0 4px #0a84ff, 0 16px 40px rgba(0, 0, 0, 0.18); }
  .rounded .device { border-radius: 28px; }

  /* play */
  .play { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
  .stage { transform-origin: center; }
  .stage .device { border-radius: 44px; box-shadow: 0 0 0 10px #1d1d1f, 0 24px 60px rgba(0, 0, 0, 0.25); }
  .stage.flat .device { border-radius: 0; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15); }

  /* device */
  .device { position: relative; overflow: hidden; background: #fff; width: var(--w); height: var(--h); }
  .device iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .status, .capsule { z-index: 2; }
  .device iframe.over { z-index: 1; }

  /* transitions between screens in play view (data-gg-transition) */
  @keyframes gg-push-in { from { transform: translateX(100%); } }
  @keyframes gg-push-out { to { transform: translateX(-30%); filter: brightness(0.85); } }
  @keyframes gg-push-back-in { from { transform: translateX(-30%); filter: brightness(0.85); } }
  @keyframes gg-push-back-out { to { transform: translateX(100%); } }
  @keyframes gg-slide-up-in { from { transform: translateY(100%); } }
  @keyframes gg-slide-up-out { to { filter: brightness(0.85); } }
  @keyframes gg-slide-down-in { from { filter: brightness(0.85); } }
  @keyframes gg-slide-down-out { to { transform: translateY(100%); } }
  @keyframes gg-fade-in { from { opacity: 0; } }
  @keyframes gg-fade-out { to { opacity: 0; } }
  .status {
    position: absolute; inset: 0 0 auto; height: var(--status); display: flex; align-items: center;
    justify-content: space-between; padding: 4px 28px 0 34px; pointer-events: none;
    font: 600 15px/1 -apple-system, "SF Pro Text", sans-serif; color: #000;
  }
  .status svg { display: block; }
  .capsule {
    position: absolute; top: 48px; right: 7px; width: 87px; height: 32px; border-radius: 16px;
    display: flex; align-items: center; pointer-events: none; color: #000;
    background: rgba(255, 255, 255, 0.6); border: 0.5px solid rgba(0, 0, 0, 0.12);
  }
  .capsule span { flex: 1; display: grid; place-items: center; }
  .capsule i { width: 0.5px; height: 18px; background: rgba(0, 0, 0, 0.2); }
  .light .status { color: #fff; }
  .light .capsule { color: #fff; background: rgba(0, 0, 0, 0.15); border-color: rgba(255, 255, 255, 0.35); }
  .light .capsule i { background: rgba(255, 255, 255, 0.4); }
  .error { position: absolute; inset: 0; margin: auto; height: fit-content; max-width: 420px; color: #86868b; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="seg" role="group" aria-label="视图">
    <button type="button" data-view="canvas">画布</button>
    <button type="button" data-view="play">演示</button>
  </div>
  <h1></h1>
  <div class="tools" data-for="canvas">
    <button type="button" data-zoom="out" aria-label="缩小">−</button>
    <span class="zoom"></span>
    <button type="button" data-zoom="in" aria-label="放大">+</button>
    <button type="button" data-zoom="fit">适应</button>
  </div>
  <div class="tools" data-for="play">
    <button class="back" type="button" disabled>返回</button>
    <span class="screens"></span>
  </div>
</header>
<main>
  <div class="canvas" hidden>
    <div class="world">
      <svg class="links" width="1" height="1" aria-hidden="true">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8e8e93" stroke="none"/></marker></defs>
      </svg>
    </div>
  </div>
  <div class="play" hidden><div class="stage"></div></div>
  <p class="error" hidden></p>
</main>
<template id="device">
  <div class="device">
    <iframe></iframe>
    <div class="status">
      <span>9:41</span>
      <svg width="68" height="12" viewBox="0 0 68 12" fill="currentColor" aria-hidden="true">
        <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/>
        <rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
        <path d="M30 3.2a8.6 8.6 0 0 1 11.6 0l-1.3 1.4a6.7 6.7 0 0 0-9 0zm2.6 2.8a4.8 4.8 0 0 1 6.4 0l-1.3 1.4a3 3 0 0 0-3.8 0zm3.2 2.4 1.5 1.6-1.5 1.6-1.5-1.6z"/>
        <rect x="44.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke="currentColor" opacity="0.4"/>
        <rect x="46" y="2" width="18" height="8" rx="2"/><rect x="66.5" y="4" width="1.5" height="4" rx="0.7" opacity="0.4"/>
      </svg>
    </div>
    <div class="capsule">
      <span><svg width="20" height="6" viewBox="0 0 20 6" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="2.2"/><circle cx="10" cy="3" r="3"/><circle cx="17" cy="3" r="2.2"/></svg></span>
      <i></i>
      <span><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="7.2"/><circle cx="9" cy="9" r="2.6" fill="currentColor" stroke="none"/></svg></span>
    </div>
  </div>
</template>
<script>
;(async () => {
  const DEVICES = {
    miniprogram: { w: 375, h: 812, status: 44, capsule: true, framed: true },
    mobile: { w: 390, h: 844, status: 47, capsule: false, framed: true },
    desktop: { w: 1440, h: 900, status: 0, capsule: false, framed: false },
  }
  const GAP = 120
  const $ = (s, root = document) => root.querySelector(s)
  const fail = (text) => { $('.error').hidden = false; $('.error').textContent = text }

  // An exported zip carries the manifest inline: opened from disk (file://) the shell cannot fetch it.
  let manifest
  try {
    const inline = document.getElementById('gg-manifest')
    manifest = inline
      ? JSON.parse(inline.textContent)
      : await (await fetch('gg-artifact.json', { cache: 'no-store' })).json()
  } catch {
    return fail('读不到 gg-artifact.json。请通过预览链接打开。')
  }
  const device = DEVICES[manifest.device] ?? DEVICES.miniprogram
  const screens = new Map(manifest.screens.map((s) => [s.id, s]))
  document.title = manifest.title
  $('h1').textContent = manifest.title
  document.body.style.setProperty('--w', `${device.w}px`)
  document.body.style.setProperty('--h', `${device.h}px`)
  document.body.style.setProperty('--status', `${device.status}px`)

  const makeDevice = (s) => {
    const el = $('#device').content.firstElementChild.cloneNode(true)
    $('.status', el).hidden = !device.status
    $('.capsule', el).hidden = !device.capsule
    const iframe = $('iframe', el)
    iframe.title = s.title
    iframe.src = s.file
    el.classList.toggle('light', s.statusBar === 'light')
    return { el, iframe }
  }

  // ---- canvas: every screen side by side, pan and zoom ----
  const canvas = $('.canvas'), world = $('.world'), links = $('.links')
  const frames = new Map()
  manifest.screens.forEach((s, i) => {
    const frame = document.createElement('div')
    frame.className = 'frame'
    frame.classList.toggle('rounded', device.framed)
    const x = i * (device.w + GAP)
    frame.style.left = `${x}px`
    const label = document.createElement('div')
    label.className = 'label'
    label.textContent = s.title
    const play = document.createElement('button')
    play.type = 'button'
    play.textContent = '演示'
    play.onclick = () => { setView('play'); go(s.id, 'none') }
    label.append(play)
    const { el, iframe } = makeDevice(s)
    frame.append(label, el)
    world.append(frame)
    frames.set(s.id, { frame, iframe, x })
    iframe.addEventListener('load', drawLinks)
  })
  const width = manifest.screens.length * (device.w + GAP) - GAP
  links.setAttribute('width', String(width))
  links.setAttribute('height', String(device.h))

  function drawLinks() {
    for (const p of links.querySelectorAll('path')) p.remove()
    for (const [id, f] of frames) {
      let doc
      try { doc = f.iframe.contentDocument } catch { continue }
      if (!doc) continue
      const seen = new Set()
      for (const a of doc.querySelectorAll('[data-gg-link]')) {
        const to = frames.get(a.getAttribute('data-gg-link'))
        const target = a.getAttribute('data-gg-link')
        if (!to || target === id || seen.has(target)) continue
        seen.add(target)
        const r = a.getBoundingClientRect()
        const forward = to.x > f.x
        const sx = forward ? f.x + device.w : f.x
        const sy = Math.min(Math.max(r.top + r.height / 2, 24), device.h - 24)
        const tx = forward ? to.x : to.x + device.w
        const ty = forward ? 120 : device.h - 120
        const bend = Math.max(60, Math.abs(tx - sx) / 2)
        // Forward links arc straight across; links back swing below the screens in between.
        const d = forward
          ? `M${sx} ${sy} C${sx + bend} ${sy} ${tx - bend} ${ty} ${tx} ${ty}`
          : `M${sx} ${sy} C${sx - 80} ${device.h + 120} ${tx + 80} ${device.h + 120} ${tx} ${ty}`
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        path.setAttribute('d', d)
        path.setAttribute('marker-end', 'url(#arrow)')
        links.append(path)
      }
    }
  }

  const view = { x: 0, y: 0, z: 1 }
  const apply = () => {
    // Whole pixels: fractional offsets make screens' fixed bars leak a sliver of the content behind them.
    world.style.transform = `translate(${Math.round(view.x)}px, ${Math.round(view.y)}px) scale(${view.z})`
    canvas.style.backgroundPosition = `${view.x}px ${view.y}px`
    canvas.style.backgroundSize = `${24 * view.z}px ${24 * view.z}px`
    $('.zoom').textContent = `${Math.round(view.z * 100)}%`
  }
  // Whole-pixel screen heights too, for the same reason as in apply().
  const snap = (z) => Math.round(Math.min(2, Math.max(0.1, z)) * device.h) / device.h
  const zoomAt = (z, cx, cy) => {
    z = snap(z)
    view.x = cx - ((cx - view.x) * z) / view.z
    view.y = cy - ((cy - view.y) * z) / view.z
    view.z = z
    apply()
  }
  const fit = () => {
    const box = canvas.getBoundingClientRect()
    const h = device.h + 140
    view.z = snap(Math.min(1, (box.width - 96) / width, (box.height - 96) / h))
    view.x = (box.width - width * view.z) / 2
    view.y = (box.height - h * view.z) / 2 + 40 * view.z
    apply()
  }
  const focus = (id) => {
    const f = frames.get(id)
    if (!f) return
    const box = canvas.getBoundingClientRect()
    view.x = box.width / 2 - (f.x + device.w / 2) * view.z
    world.style.transition = 'transform 0.35s ease'
    apply()
    setTimeout(() => { world.style.transition = '' }, 400)
    for (const g of frames.values()) g.frame.classList.toggle('focus', g === f)
    setTimeout(() => f.frame.classList.remove('focus'), 1200)
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault()
    const box = canvas.getBoundingClientRect()
    if (e.ctrlKey || e.metaKey) zoomAt(view.z * Math.exp(-e.deltaY * 0.01), e.clientX - box.left, e.clientY - box.top)
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply() }
  }, { passive: false })
  let drag = null
  canvas.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return
    drag = { id: e.pointerId, x: e.clientX - view.x, y: e.clientY - view.y }
    canvas.setPointerCapture(e.pointerId)
    canvas.classList.add('dragging')
  })
  canvas.addEventListener('pointermove', (e) => {
    if (drag?.id !== e.pointerId) return
    view.x = e.clientX - drag.x
    view.y = e.clientY - drag.y
    apply()
  })
  const endDrag = () => { drag = null; canvas.classList.remove('dragging') }
  canvas.addEventListener('pointerup', endDrag)
  canvas.addEventListener('pointercancel', endDrag)
  for (const b of document.querySelectorAll('[data-zoom]'))
    b.onclick = () => {
      const box = canvas.getBoundingClientRect()
      if (b.dataset.zoom === 'fit') fit()
      else zoomAt(view.z * (b.dataset.zoom === 'in' ? 1.25 : 0.8), box.width / 2, box.height / 2)
    }

  // ---- play: one device, follow the links ----
  const stage = $('.stage'), back = $('.back'), list = $('.screens')
  stage.classList.toggle('flat', !device.framed)
  const player = makeDevice(manifest.screens[0])
  stage.append(player.el)
  for (const s of manifest.screens) {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = s.title
    b.dataset.id = s.id
    b.onclick = () => go(s.id, 'none')
    list.append(b)
  }
  const fitStage = () => {
    const box = $('.play').getBoundingClientRect()
    const pad = device.framed ? 68 : 48
    stage.style.transform = `scale(${Math.min(1, (box.width - pad) / device.w, (box.height - pad) / device.h)})`
  }
  // Each entry: the screen and how it was entered, so going back plays the reverse.
  const stack = []
  const TRANSITIONS = ['none', 'push', 'push-back', 'slide-up', 'fade']
  const REVERSE = { push: 'push-back', 'push-back': 'push', 'slide-up': 'slide-down', fade: 'fade', none: 'none' }
  const still = matchMedia('(prefers-reduced-motion: reduce)')
  const show = (id, transition = 'none') => {
    const s = screens.get(id)
    for (const f of player.el.querySelectorAll('iframe')) if (f !== player.iframe) f.remove()
    const old = player.iframe
    old.style.animation = ''
    old.classList.remove('over')
    if (transition === 'none' || still.matches) {
      old.src = s.file
      old.title = s.title
    } else {
      const next = document.createElement('iframe')
      next.title = s.title
      next.style.visibility = 'hidden'
      old.after(next)
      // Pushing back and sliding down move the old screen away on top of the new one.
      const leaving = transition === 'push-back' || transition === 'slide-down'
      ;(leaving ? old : next).classList.add('over')
      next.addEventListener(
        'load',
        () => {
          next.style.visibility = ''
          next.style.animation = `gg-${transition}-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both`
          old.style.animation = `gg-${transition}-out 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both`
          next.addEventListener(
            'animationend',
            () => {
              old.remove()
              next.style.animation = ''
              next.classList.remove('over')
            },
            { once: true },
          )
        },
        { once: true },
      )
      next.src = s.file
      player.iframe = next
    }
    player.el.classList.toggle('light', s.statusBar === 'light')
    for (const b of list.children) b.toggleAttribute('aria-current', b.dataset.id === id)
    back.disabled = stack.length < 2
    history.replaceState(null, '', `#play:${id}`)
  }
  const go = (id, transition = 'none') => {
    if (!screens.has(id) || stack.at(-1)?.id === id) return
    const t = TRANSITIONS.includes(transition) ? transition : 'push'
    stack.push({ id, t })
    show(id, t)
  }
  back.onclick = () => {
    if (stack.length < 2) return
    const { t } = stack.pop()
    show(stack.at(-1).id, REVERSE[t])
  }

  // ---- views ----
  let current
  function setView(v) {
    current = v
    for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === v))
    for (const t of document.querySelectorAll('[data-for]')) t.hidden = t.dataset.for !== v
    canvas.hidden = v !== 'canvas'
    $('.play').hidden = v !== 'play'
    if (v === 'canvas') {
      history.replaceState(null, '', location.pathname + location.search)
      fit()
    } else {
      fitStage()
      if (!stack.length) go(manifest.entry, 'none')
      else show(stack.at(-1).id)
    }
  }
  for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view)
  addEventListener('resize', () => (current === 'canvas' ? fit() : fitStage()))

  addEventListener('message', (e) => {
    const local = location.protocol === 'file:' && (e.origin === 'null' || e.origin === 'file://')
    if ((e.origin !== location.origin && !local) || e.data?.type !== 'gg:nav') return
    if (current === 'play') {
      if (e.source !== player.iframe.contentWindow) return
      // A link without data-gg-transition pushes.
      if (e.data.screen) go(e.data.screen, e.data.transition ?? 'push')
      else back.onclick()
      return
    }
    if ([...frames.values()].some((f) => f.iframe.contentWindow === e.source) && e.data.screen) focus(e.data.screen)
  })

  const hash = decodeURIComponent(location.hash.slice(1))
  if (hash.startsWith('play:')) {
    const id = hash.slice(5)
    stack.push({ id: screens.has(id) ? id : manifest.entry, t: 'none' })
    setView('play')
  } else setView('canvas')
})()
</script>
</body>
</html>
