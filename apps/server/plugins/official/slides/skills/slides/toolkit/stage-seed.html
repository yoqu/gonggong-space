<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage seed</title>
<style>
/* ===== Stage kernel: 1920×1080 slides scaled to the window. Keep this block as is. ===== */
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s .35s}
.slide.is-active{visibility:visible;opacity:1;transition:opacity .35s ease}
.slide .notes{display:none}
.slide [data-step]{opacity:0;transform:translateY(16px);transition:opacity .3s ease,transform .3s ease}
.slide [data-step].is-shown{opacity:1;transform:none}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{height:auto;overflow:visible;background:none}
  .deck{position:static;transform:none!important}
  .slide{position:relative;visibility:visible;opacity:1;break-after:page;width:1920px;height:1080px}
  .slide [data-step]{opacity:1;transform:none}
}
/* ===== Template styles below ===== */
.slide{background:#fff;color:#111;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:120px 140px;box-sizing:border-box}
h1{font-size:96px;margin:0}
</style>
<script src="./deck-toolkit.js"></script>
</head>
<body>
<div class="deck">
  <section class="slide" data-section="cover" data-title="封面">
    <h1>标题</h1>
    <aside class="notes">演讲者备注</aside>
  </section>
  <section class="slide" data-section="steps" data-title="分步出现">
    <p data-step>按 → 先逐条出现</p>
    <p data-step>出完再翻到下一页</p>
  </section>
</div>
<script>
/* Stage kernel: paging, in-slide steps ([data-step]), scaling, window.deck for deck-toolkit.js. Keep as is. */
(function () {
  var deck = document.querySelector('.deck');
  var slides = Array.prototype.slice.call(deck.querySelectorAll(':scope > .slide'));
  var idx = 0, step = 0;
  function steps(i) { return slides[i].querySelectorAll('[data-step]'); }
  function show(i, s) {
    idx = Math.max(0, Math.min(slides.length - 1, i));
    var list = steps(idx);
    step = s === undefined ? list.length : Math.max(0, Math.min(list.length, s));
    slides.forEach(function (el, k) { el.classList.toggle('is-active', k === idx); });
    Array.prototype.forEach.call(list, function (el, k) { el.classList.toggle('is-shown', k < step); });
    document.dispatchEvent(new CustomEvent('slidechange', { detail: { index: idx, step: step, slide: slides[idx] } }));
  }
  function next() {
    if (step < steps(idx).length) show(idx, step + 1);
    else if (idx < slides.length - 1) show(idx + 1, 0);
  }
  function prev() {
    if (step > 0 && steps(idx).length) show(idx, step - 1);
    else if (idx > 0) show(idx - 1);
  }
  function fit() {
    var k = Math.min(innerWidth / 1920, innerHeight / 1080);
    deck.style.transform = 'scale(' + k + ') translate(-50%,-50%)';
  }
  window.deck = { slides: slides, get index() { return idx; }, go: function (n) { show(n); }, next: next, prev: prev };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') next();
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') prev();
    else if (k === 'Home') show(0, 0);
    else if (k === 'End') show(slides.length - 1);
    else return;
    e.preventDefault();
  });
  var tx = null;
  addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', function (e) {
    if (tx === null) return;
    var d = e.changedTouches[0].clientX - tx;
    if (Math.abs(d) > 50) (d < 0 ? next : prev)();
    tx = null;
  });
  addEventListener('resize', fit);
  fit();
  show(0, 0);
})();
</script>
</body>
</html>
