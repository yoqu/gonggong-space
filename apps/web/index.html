<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 团队工作区</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes the wrong theme.
      // Must stay in sync with src/app/theme.ts (key aiws.theme, fallback light) and src/app/glass.ts (key aiws.glass, fallback standard).
      ;(() => {
        let theme = 'light'
        try {
          const pref = localStorage.getItem('aiws.theme')
          if (pref === 'dark' || pref === 'system') {
            theme =
              pref === 'dark' || window.matchMedia?.('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
        } catch {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        let glass = 'standard'
        try {
          const level = localStorage.getItem('aiws.glass')
          if (level === 'clear' || level === 'tinted') glass = level
        } catch {}
        document.documentElement.dataset.glass = glass
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
