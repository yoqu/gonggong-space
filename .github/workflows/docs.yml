name: Docs

on:
  push:
    branches: [main]
    # The home page imports the web app's personas (and through them its i18n and the protocol package) and mascot.css.
    paths:
      - website/**
      - apps/web/src/features/bots/personas.ts
      - apps/web/src/i18n/**
      - apps/web/src/**/en.ts
      - apps/web/src/ui/mascot.css
      - packages/protocol/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@gonggong/website..."
      - run: pnpm --filter @gonggong/website build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
