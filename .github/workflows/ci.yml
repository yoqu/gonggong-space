name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Same cluster as scripts/pg.sh: user gonggong, trust auth, port 54329 (apps/server/src/db/client.ts defaults).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gonggong
          POSTGRES_DB: gonggong
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gonggong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # Full install: the daemon's Rust tests drive tools/mock-agent.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node --test tools/*.test.mjs
      # backup.sh runs pg_dump, which must match the server's major (the runner ships 16; pg_wrapper picks the newest).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - run: pnpm -r test
      # The Tauri desktop crate needs webkit2gtk & co. on Linux: its tests stay local (macOS) for now.
      - run: cargo test --workspace --exclude gonggong-desktop
