# One service = one 共工 machine. For another machine copy the service with its own hostname, GONGGONG_MACHINE_ID
# and volume. See website/deploy/daemon-docker.md.
services:
  daemon:
    image: gonggong-daemon:${GG_VERSION:?set GG_VERSION, e.g. 0.4.9}
    build:
      context: .
      args:
        GG_VERSION: ${GG_VERSION}
    hostname: gg-server-1
    environment:
      # Stable and unique per container: the server recognises the machine by it across rebuilds.
      GONGGONG_MACHINE_ID: ${GONGGONG_MACHINE_ID:?set GONGGONG_MACHINE_ID, e.g. openssl rand -hex 16}
    volumes:
      - home:/home/gg
    restart: unless-stopped
    shm_size: 1g
    cpus: ${GG_CPUS:-4}
    mem_limit: ${GG_MEMORY:-8g}
volumes:
  home:
