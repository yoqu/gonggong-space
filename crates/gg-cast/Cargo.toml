[package]
name = "gg-cast"
version = "0.1.0"
edition = "2024"
publish = false

# Spike (plan 结果预览 B0): its own workspace, see the root Cargo.toml.
[workspace]

[dependencies]
anyhow = "1.0.104"
enigo = "0.6.1"
livekit = { version = "0.9.3", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.8.1", default-features = false, features = ["access-token"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
xcap = "0.9.8"
