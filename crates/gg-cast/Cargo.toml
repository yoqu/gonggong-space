[package]
name = "gg-cast"
version = "0.1.0"
edition = "2024"
publish = false

# Desktop preview publisher (plan 结果预览 B2), started by the daemon. Its own workspace: libwebrtc is a ~277 MB
# download, so only the release pipeline builds it and daemons download it on first use.
[workspace]

[dependencies]
anyhow = "1.0.104"
enigo = "0.6.1"
livekit = { version = "0.9.3", features = ["rustls-tls-native-roots"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

# Window lookup; on Linux gg-cast only publishes a virtual display's screen (xcap there also needs PipeWire newer than
# the Debian 11 build image has).
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.8"

# Foregrounding the controlled window; the version xcap already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# The version enigo already uses.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

# Downloaded by daemons: B0 measured 29 MB → 22 MB stripped.
[profile.release]
strip = true
