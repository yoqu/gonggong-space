[package]
name = "gonggong"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gg"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "2.2.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1.0.104"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
fs4 = "1.1.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
machine-uid = "0.6.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["chrono", "deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

# UI Automation for the WeChat devtools' prompts; the version already in the lockfile (Tauri).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
tokio-rustls = "0.26.5"
tokio = { version = "1.53.1", features = ["test-util"] }
