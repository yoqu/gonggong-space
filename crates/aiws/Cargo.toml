[package]
name = "aiws"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aiws"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "2.2.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
