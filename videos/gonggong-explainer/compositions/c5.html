      <div id="c5-root" data-composition-id="c5" data-width="1920" data-height="1080">

          <div class="kps">

        <div class="screen" id="c5-s1">
          <div class="bar"><i></i><i></i><i></i><span>超出档位 → 审批卡片</span></div>
          <div class="vp"><div class="zoomer" id="c5-z1"><img src="assets/shots/approval.webp" width="1611" height="564" alt="" /><svg class="ring" id="c5-r1"></svg><svg class="ring" id="c5-r2"></svg><svg class="ring" id="c5-r3"></svg><svg class="ring" id="c5-r4"></svg></div></div>

        <div class="panel" id="c5-timer"><div class="t mono" id="c5-tv">30:00</div><div class="bar2"><i id="c5-tb"></i></div><div class="l">无人处理</div></div>

          <div class="bar"><i></i><i></i><i></i><span>拿不准？出道选择题</span></div>
          <div class="vp"><div class="zoomer" id="c5-z2"><img src="assets/shots/question.webp" width="1375" height="768" alt="" /><svg class="ring" id="c5-r5"></svg></div></div>

        <div class="lv" id="c5-lv"><div class="lv-bg"></div><div class="lv-n">第 5 关</div><div class="lv-t">权限与审批</div><img class="lv-g" src="assets/cast/gong-run.svg" alt="" /><div class="lv-dots"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="cur"></i><i></i><i></i><i></i></div></div>

      <script>
        const tl = gsap.timeline({ paused: true })
        const S1 = 0.75
        const S2 = 1375 / 2148
        GG.ring('#c5-r1', S1, [160, 524, 610, 34], 8)
        GG.ring('#c5-r2', S1, [118, 73, 913, 70], 8)
        GG.ring('#c5-r3', S1, [164, 572, 95, 40], 6)
        GG.ring('#c5-r4', S1, [417, 572, 97, 40], 6)
        GG.ring('#c5-r5', S2, [160, 300, 730, 70], 8)

        const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2.4)' }, t)

        GG.level(tl, '#c5-lv')
        GG.head(tl, '#c5-col')

        // c5a — the pessimist panics
        tl.fromTo('#c5-inv', { y: 560, scale: 0.8 }, { y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 1.7)
        tl.fromTo('#c5-inv .say', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.6)' }, 1.95)
        tl.fromTo('#c5-inv img', { x: 0 }, { x: 9, duration: 0.06, yoyo: true, repeat: 49, ease: 'none' }, 2.2)
        tl.fromTo('#c5-warn', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 3.35)
        tl.to('#c5-warn', { backgroundColor: '#ff6b57', duration: 0.18, yoyo: true, repeat: 5 }, 3.65)
        tl.to('#c5-inv', { y: 560, opacity: 0, duration: 0.35, ease: 'power2.in' }, 5.2)
        GG.leave(tl, '#c5-warn', 5.2)

        // c5b — three permission tiers
        tl.fromTo('#c5-stp-h', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 5.55)
        ;['#c5-p1', '#c5-p2', '#c5-p3'].forEach((s, i) =>
          tl.fromTo(s, { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.5)' }, 5.55 + i * 0.15))
        GG.kp(tl, '#c5-k1', 6.3)
        ;[[9.6, '#1f8f3f'], [10.2, '#c45f00'], [11.15, '#d23b2a']].forEach(([t, c], i) => {
          const s = `#c5-p${i + 1}`
          tl.to(`${s} .fill`, { opacity: 1, duration: 0.3 }, t)
          tl.to(`${s} .cap`, { backgroundColor: c, duration: 0.3 }, t)
          tl.to(`${s} .ds`, { color: '#1d1d1f', duration: 0.3 }, t)
          tl.fromTo(s, { scale: 1 }, { scale: 1.05, duration: 0.18, yoyo: true, repeat: 1, ease: 'sine.out' }, t)
        })
        ;['#c5-stp-h', '#c5-p1', '#c5-p2', '#c5-p3'].forEach((s) => GG.leave(tl, s, 12.1))

        // c5c — approval card, owner only, 30-minute timeout
        GG.enter(tl, '#c5-s1', 12.45)
        GG.kp(tl, '#c5-k2', 13.2)
        GG.draw(tl, '#c5-r1', 13.0)
        GG.draw(tl, '#c5-r2', 14.2)
        GG.focus(tl, '#c5-z1', S1, [130, 470, 600, 150], 820, 564, 15.0)
        GG.draw(tl, '#c5-r3', 15.6, 0.4)
        GG.draw(tl, '#c5-r4', 15.9, 0.4)
        tl.fromTo('#c5-own', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 15.7)
        pop('#c5-own .bd', 16.1)
        pop('#c5-n1', 16.2)
        tl.fromTo('#c5-adm', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out' }, 17.2)
        tl.to('#c5-adm', { x: -70, duration: 0.25, ease: 'power2.in' }, 17.55)
        tl.to('#c5-adm', { x: 0, duration: 0.35, ease: 'back.out(3)' }, 17.8)
        pop('#c5-adm .bd', 17.8)
        tl.to('#c5-adm', { rotation: 4, duration: 0.07, yoyo: true, repeat: 5 }, 17.85)
        tl.to('#c5-n1', { opacity: 0, duration: 0.25 }, 18.6)
        GG.enter(tl, '#c5-timer', 18.6, 'down')
        GG.kp(tl, '#c5-k3', 18.8)
        tl.set('#c5-tv', { textContent: '30:00' }, 0)
        ;['30:00', '25:00', '20:00', '15:00', '10:00', '05:00', '01:00', '00:00'].forEach((v, i) => tl.set('#c5-tv', { textContent: v }, 18.9 + i * 0.18))
        tl.fromTo('#c5-tb', { scaleX: 1 }, { scaleX: 0, duration: 1.26, ease: 'none' }, 18.9)
        tl.to('#c5-tv', { color: '#d23b2a', duration: 0.2 }, 20.1)
        tl.fromTo('#c5-seal', { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.25, ease: 'power4.in' }, 20.25)
        tl.fromTo('#c5-timer', { y: 0 }, { y: 6, duration: 0.05, yoyo: true, repeat: 3 }, 20.5)
        ;['#c5-s1', '#c5-own', '#c5-adm', '#c5-timer', '#c5-seal'].forEach((s) => GG.leave(tl, s, 21.15))

        // c5d — when unsure, it asks the group
        GG.enter(tl, '#c5-s2', 21.4)
        GG.cameo(tl, '#c5-cam', 21.4, 26.1)
        GG.kp(tl, '#c5-k4', 21.9)
        ;['#c5-qtags .chip:nth-child(1)', '#c5-qtags .chip:nth-child(2)', '#c5-qtags .chip:nth-child(3)'].forEach((s, i) =>
          tl.fromTo(s, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: 'back.out(2)' }, 22.4 + i * 0.3))
        GG.draw(tl, '#c5-r5', 22.6)

        window.__timelines['c5'] = tl
      </script>
