<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 68 68" style="--t:1"><style>.lbl{font-family:-apple-system,"PingFang SC",sans-serif;font-weight:700}.fig{transform-origin:20px 40px}.hand,.tap,.h1,.h2{transform-box:fill-box}.hand{transform-origin:center}.h1{animation:key calc(var(--t)*0.24s) ease-in-out infinite alternate}.h2{animation:key calc(var(--t)*0.24s) ease-in-out infinite alternate-reverse}@keyframes key{to{transform:translateY(-2px)}}.code rect{transform-box:fill-box;transform-origin:0 50%;animation:ln calc(var(--t)*1.8s) steps(1) infinite}.l2{animation-delay:calc(var(--t)*0.3s)!important}.l3{animation-delay:calc(var(--t)*0.6s)!important}@keyframes ln{0%{transform:scaleX(0)}30%,100%{transform:scaleX(1)}}.sweep{transform-origin:20px 22.3px;animation:spin 2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blip{animation:blip 2s steps(1) infinite}@keyframes blip{0%,10%{opacity:1}20%,100%{opacity:.15}}.tip{animation:tip 1s steps(1) infinite}@keyframes tip{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important;transition:none!important}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56688a"/><stop offset="1" stop-color="#121a2a"/></linearGradient><clipPath id="t"><rect width="40" height="40" rx="9"/></clipPath></defs><ellipse cx="20" cy="46.5" rx="14" ry="1.8" fill="#000" opacity=".1"/><g class="fig"><rect width="40" height="40" rx="9" fill="url(#g)"/><g clip-path="url(#t)"><path d="M20 11.4V7" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle class="tip" cx="20" cy="6" r="1.6" fill="#ff5f57"/><path d="M9 23a11 11 0 0 1 22 0v5a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z" fill="#fff"/><defs><clipPath id="v"><rect x="11" y="18.6" width="18" height="7.4" rx="3.7"/></clipPath></defs><rect x="11" y="18.6" width="18" height="7.4" rx="3.7" fill="#121a2a"/><g clip-path="url(#v)"><path class="sweep" d="M20 22.3