<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s02-wrap { position: absolute; inset: 0; }
        #s02-wrap .term { white-space: normal; }
        #s02-wrap .term .line { white-space: pre; }
        #s02-a { position: absolute; inset: 0; }
        #s02-title { position: absolute; left: 110px; top: 230px; width: 860px; }
        #s02-title .kicker { display: block; margin-bottom: 26px; }
        #s02-l1 { display: block; font-size: 96px; color: var(--mute); }
        #s02-l2 { display: block; font-size: 128px; margin-top: 12px; }
        #s02-term { left: 1010px; top: 250px; width: 820px; height: 390px; }
        #s02-term .term { font-size: 28px; line-height: 1.7; }
        #s02-term .line { display: block; min-height: 42px; }
        #s02-glow { position: absolute; left: 960px; top: 470px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; background: radial-gradient(circle, rgba(61, 123, 255, 0.4), rgba(61, 123, 255, 0) 60%); display: block; }

        #s02-b { position: absolute; left: 0; right: 0; top: 150px; height: 560px; display: flex; flex-direction: column; align-items: center; }
        #s02-brand { display: flex; align-items: center; gap: 48px; }
        #s02-logo { width: 200px; height: 200px; display: block; border-radius: 46px; box-shadow: 0 0 80px rgba(61, 123, 255, 0.55); }
        #s02-name { font-size: 196px; letter-spacing: 0.04em; display: block; }
        #s02-en { margin-top: 10px; font-family: var(--mono); font-size: 30px; letter-spacing: 0.4em; color: var(--accent-hi); display: block; }
        #s02-chips { margin-top: 40px; display: flex; gap: 20px; }

        #s02-c { position: absolute; left: 0; right: 0; top: 650px; display: flex; justify-content: center; }
        #s02-q { font-size: 92px; display: block; }
        #s02-qm { position: absolute; right: 90px; top: 120px; font-family: var(--display); font-size: 620px; line-height: 1; color: rgba(61, 123, 255, 0.16); display: block; }
      </style>
      <div id="root" class="scene" data-composition-id="s02" data-width="1920" data-height="1080">
        <div id="s02-wrap">
          
          <span id="s02-glow"></span>
          <div id="s02-a">
            <div id="s02-title">
              <span class="kicker">// 国庆假期 · 基本没出门</span>
              <span class="big" id="s02-l1">在家肝了个</span>
              <span class="big" id="s02-l2"><span class="hl">开源</span>项目</span>
            </div>
            <div class="win" id="s02-term">
              <div class="win-bar"><i></i><i></i><i></i><span>~/gonggong-space — zsh</span></div>
              <div class="term">
                <span class="line"><span class="p">$</span> <span id="s02-cmd"></span></span>
                <span class="line a" id="s02-g1"></span>
                <span class="line a" id="s02-g2"></span>
                <span class="line a" id="s02-g3"></span>
                <span class="line a" id="s02-g4"></span>
                <span class="line" id="s02-g5"></span>
              </div>
            </div>
          </div>
          <div id="s02-b">
            <div id="s02-brand">
              <img id="s02-logo" src="assets/logo.svg" alt="" />
              <span class="big" id="s02-name">共工空间</span>
            </div>
            
            <div id="s02-chips">
              <span class="chip" id="s02-k1"><span class="dot"></span>开源 · Apache-2.0</span>
              <span class="chip" id="s02-k2">Claude Code</span>
              <span class="chip" id="s02-k3">Codex</span>
            </div>
          </div>
          <div id="s02-c"><span class="big" id="s02-q">我为什么要做它<span class="hl">？</span></span></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const TYPES = [];
        const type = (id, text, at, dur) => TYPES.push([document.getElementById(id), text, at, dur]);
        tl.fromTo("#s02-title .kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.05);
        tl.fromTo("#s02-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
        tl.fromTo("#s02-l2", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 1.4);
        tl.fromTo("#s02-term", { opacity: 0, x: 120, rotationY: -20, transformPerspective: 1600 }, { opacity: 1, x: 0, rotationY: -7, duration: 0.7, ease: "power3.out" }, 0.3);
        type("s02-cmd", "git log --oneline", 0.8, 0.6);
        type("s02-g1", "feat(teams): 注册入团收口", 1.5, 0.35);
        type("s02-g2", "feat(bind): 绑定即用", 1.9, 0.35);
        type("s02-g3", "feat(schedules): 定时任务", 2.3, 0.35);
        type("s02-g4", "chore(release): v0.3.0", 2.7, 0.3);
        type("s02-g5", "# 国庆这几天，就干了这个", 3.1, 0.4);

        tl.fromTo("#s02-a", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.92, duration: 0.4, ease: "power2.in", immediateRender: false }, 3.75);
        tl.fromTo("#s02-glow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 3.9);
        tl.fromTo("#s02-logo", { opacity: 0, scale: 0.3, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 4.0);
        const nameEl = document.getElementById("s02-name");
        const finalName = "共工空间";
        const pool = "01#@<>/{}[]=$_%&*";
        tl.fromTo("#s02-name", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.1);
        tl.fromTo("#s02-chips .chip", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)", stagger: 0.12 }, 4.85);

        tl.fromTo("#s02-b", { y: 0, scale: 1 }, { y: -40, scale: 0.86, duration: 0.6, ease: "power3.inOut" }, 5.4);
        tl.fromTo("#s02-q", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.55);
        tl.fromTo("#s02-wrap", { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 9.08);
        const clock = { t: 0 };
        const paint = (t) => {
          for (const [el, text, at, dur] of TYPES) el.textContent = text.slice(0, Math.round(Math.min(1, Math.max(0, (t - at) / dur)) * text.length));
            const p = Math.min(1, Math.max(0, (t - 4.1) / 0.7));
            const k = Math.floor(p * 14);
            let s = "";
            for (let i = 0; i < 4; i++) s += p >= 0.25 * (i + 1) - 0.01 ? finalName[i] : pool[(k * 7 + i * 5) % pool.length];
            nameEl.textContent = s;
        };
        tl.fromTo(clock, { t: 0 }, { t: 9.432, duration: 9.432, ease: "none", onUpdate: () => paint(clock.t) }, 0);
        paint(0);
        window.__ggRetime(tl, "s02");
        window.__timelines["s02"] = tl;
      </script>
    </template>
  </body>
</html>
