<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s11-wrap { position: absolute; inset: 0; }
        #s11-q { position: absolute; left: 130px; top: 170px; width: 1660px; }
        #s11-q .kicker { display: block; margin-bottom: 24px; }
        #s11-q .big { display: block; font-size: 96px; }
        #s11-row { position: absolute; left: 130px; right: 130px; top: 470px; height: 380px; display: flex; align-items: center; justify-content: center; gap: 120px; }
        .s11-num { position: relative; width: 300px; height: 340px; border-radius: 28px; border: 3px solid var(--line-strong); background: var(--panel); display: grid; place-items: center; font-family: var(--display); font-size: 260px; line-height: 1; color: var(--fg); }
        .s11-num i { position: absolute; left: 22px; top: 18px; font-style: normal; font-family: var(--mono); font-size: 22px; color: var(--accent-hi); letter-spacing: 0.1em; }
        #s11-n2 { color: var(--accent-hi); border-color: var(--accent); box-shadow: 0 0 50px rgba(61, 123, 255, 0.45); }
      </style>
      <div id="root" class="scene" data-composition-id="s11" data-width="1920" data-height="1080">
        <div id="s11-wrap">
          <div id="s11-q">
            <span class="kicker">// 和别的工具比</span>
            <span class="big">有什么<span class="hl">不一样</span>？</span>
          </div>
          <div id="s11-row">
            <div class="s11-num" id="s11-n1">1</div>
            <div class="s11-num" id="s11-n2">2</div>
            <div class="s11-num" id="s11-n3">3</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s11-q .kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.0);
        tl.fromTo("#s11-q .big", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo("#s11-n1", { opacity: 0, scale: 2.2, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.28, ease: "expo.in" }, 1.25);
        tl.fromTo("#s11-n2", { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 1.55);
        tl.fromTo("#s11-n3", { opacity: 0, x: 260, rotation: 12 }, { opacity: 1, x: 0, rotation: 0, duration: 0.3, ease: "power4.out" }, 1.85);
        tl.fromTo("#s11-row", { scale: 1 }, { scale: 1.04, duration: 0.5, ease: "sine.inOut" }, 2.1);
        tl.fromTo("#s11-wrap", { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 2.6);
        window.__ggRetime(tl, "s11");
        window.__timelines["s11"] = tl;
      </script>
    </template>
