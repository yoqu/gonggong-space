<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/data.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05080f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--fg); }

      #bg { position: absolute; inset: 0; }
      #bg .grid { position: absolute; inset: -40px; background-image: radial-gradient(rgba(122, 166, 255, 0.28) 1.6px, transparent 1.8px); background-size: 40px 40px; opacity: 0.22; }
      #bg .glow { position: absolute; border-radius: 50%; display: block; }
      #glow-a { width: 1300px; height: 1300px; right: -420px; top: -560px; background: radial-gradient(circle, rgba(61, 123, 255, 0.2), rgba(61, 123, 255, 0) 62%); }
      #glow-b { width: 1100px; height: 1100px; left: -460px; bottom: -560px; background: radial-gradient(circle, rgba(31, 200, 187, 0.1), rgba(31, 200, 187, 0) 62%); }
      #bg .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(5, 8, 15, 0) 55%, rgba(5, 8, 15, 0.85) 100%); }

      #host { position: absolute; left: 52px; bottom: 44px; width: 132px; height: 132px; }
      #host .ring { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 24px rgba(61, 123, 255, 0.7); }
      #host .ring2 { position: absolute; inset: -22px; border-radius: 50%; border: 2px solid rgba(31, 200, 187, 0.6); }
      #host img { position: absolute; inset: 0; width: 132px; height: 132px; border-radius: 50%; display: block; border: 3px solid #0b1222; }
      #host .name { position: absolute; left: 50%; bottom: -30px; width: 200px; margin-left: -100px; text-align: center; font-size: 18px; font-weight: 800; color: var(--fg); }

      #cap { position: absolute; left: 260px; right: 260px; bottom: 58px; height: 110px; display: flex; align-items: center; justify-content: center; }
      #cap-line { display: block; max-width: 1400px; padding: 14px 30px; border-radius: 14px; background: rgba(5, 8, 15, 0.72); font-size: 44px; font-weight: 700; line-height: 1.3; text-align: center; color: #f4f7ff; letter-spacing: 0.01em; }
      #cap-line .kw { color: var(--accent-hi); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="192.821" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="192.821" data-track-index="0">
        <div class="grid" id="bg-grid"></div>
        <span class="glow" id="glow-a"></span>
        <span class="glow" id="glow-b"></span>
        <div class="vig"></div>
      </div>

      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0.0" data-duration="6.516" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02.html" data-start="6.516" data-duration="9.468" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03.html" data-start="15.984" data-duration="9.36" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04.html" data-start="25.344" data-duration="6.372" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05.html" data-start="31.716" data-duration="8.244" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06.html" data-start="39.96" data-duration="7.56" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s07" data-composition-id="s07" data-composition-src="compositions/s07.html" data-start="47.52" data-duration="11.124" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s08" data-composition-id="s08" data-composition-src="compositions/s08.html" data-start="58.644" data-duration="17.344" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s09" data-composition-id="s09" data-composition-src="compositions/s09.html" data-start="75.988" data-duration="8.612" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s10" data-composition-id="s10" data-composition-src="compositions/s10.html" data-start="84.6" data-duration="13.824" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s11" data-composition-id="s11" data-composition-src="compositions/s11.html" data-start="98.424" data-duration="3.636" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s12" data-composition-id="s12" data-composition-src="compositions/s12.html" data-start="102.06" data-duration="19.872" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s13" data-composition-id="s13" data-composition-src="compositions/s13.html" data-start="121.932" data-duration="13.968" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s14" data-composition-id="s14" data-composition-src="compositions/s14.html" data-start="135.9" data-duration="14.004" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s15" data-composition-id="s15" data-composition-src="compositions/s15.html" data-start="149.904" data-duration="16.02" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s16" data-composition-id="s16" data-composition-src="compositions/s16.html" data-start="165.924" data-duration="11.628" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s17" data-composition-id="s17" data-composition-src="compositions/s17.html" data-start="177.552" data-duration="15.269" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="cap" class="clip" data-start="0" data-duration="191.321" data-track-index="4"><div id="cap-line"></div></div>

      <div id="host" class="clip" data-start="0" data-duration="192.821" data-track-index="5">
        <span class="ring2" id="ring2"></span>
        <span class="ring" id="ring"></span>
        <img src="assets/avatar.png" alt="" />
        <span class="name">一叶知秋</span>
      </div>

      <audio id="vo" src="assets/audio/vo.wav" data-start="0" data-duration="191.381" data-track-index="6" data-volume="1"></audio>
      <audio id="bed" src="assets/audio/bed.wav" data-start="0" data-duration="192.821" data-track-index="7" data-volume="1"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="192.821" data-track-index="8" data-volume="1"></audio>
    </div>
    <script>
      const D = 192.821;
      const CAPS = window.__CAPS;
      const ENV = window.__ENV;
      const KW = ["共工空间", "Claude Code", "Codex", "@", "Key", "传话筒", "云端 Agent", "组个队", "三点", "第一", "第二", "第三", "开源", "演示环境", "三档", "主人", "零点三版", "最没底", "吐槽", "审批"];
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const kwRe = new RegExp("(" + KW.map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g");
      const capHtml = CAPS.map((c) => esc(c[2]).replace(kwRe, '<span class="kw">$1</span>'));

      const capEl = document.getElementById("cap-line");
      const ring = document.getElementById("ring");
      const ring2 = document.getElementById("ring2");
      const glowA = document.getElementById("glow-a");
      const glowB = document.getElementById("glow-b");
      let lastCap = -2;

      function render(t) {
        let ci = -1;
        for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i][0] && t < CAPS[i][1] + 0.12) { ci = i; break; }
        if (ci !== lastCap) { capEl.innerHTML = ci >= 0 ? capHtml[ci] : ""; capEl.style.opacity = ci >= 0 ? "1" : "0"; lastCap = ci; }
        if (ci >= 0) {
          const p = Math.min(1, (t - CAPS[ci][0]) / 0.16);
          capEl.style.transform = "translateY(" + ((1 - p) * 14).toFixed(2) + "px)";
        }
        const e = ENV[Math.min(ENV.length - 1, Math.max(0, Math.floor(t * 30)))] || 0;
        ring.style.transform = "scale(" + (1 + e * 0.12).toFixed(3) + ")";
        ring.style.opacity = (0.45 + e * 0.55).toFixed(3);
        ring2.style.transform = "scale(" + (1 + e * 0.22).toFixed(3) + ")";
        ring2.style.opacity = (e * 0.8).toFixed(3);
        glowA.style.transform = "translate(" + (Math.sin(t * 0.21) * 90).toFixed(1) + "px," + (Math.cos(t * 0.17) * 60).toFixed(1) + "px)";
        glowB.style.transform = "translate(" + (Math.cos(t * 0.19) * 80).toFixed(1) + "px," + (Math.sin(t * 0.23) * 70).toFixed(1) + "px)";
      }

      const tl = gsap.timeline({ paused: true });
      const drive = { t: 0 };
      tl.to(drive, { t: D, duration: D, ease: "none", onUpdate: () => render(drive.t) }, 0);
      render(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
