<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 68 68" style="--t:1"><style>.lbl{font-family:-apple-system,"PingFang SC",sans-serif;font-weight:700}.fig{transform-origin:20px 40px}.hand,.tap,.h1,.h2{transform-box:fill-box}.hand{transform-origin:center}.fig,.load{animation:heave calc(var(--t)*0.8s) ease-in-out infinite}@keyframes heave{50%{transform:translateY(1.2px)}}.fl{animation:stepl calc(var(--t)*0.8s) ease-in-out infinite}.fr{animation:stepl calc(var(--t)*0.8s) ease-in-out infinite reverse}@keyframes stepl{50%{transform:translateY(-1.8px)}}.sweat{animation:drip calc(var(--t)*1.2s) ease-in infinite}@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(5px);opacity:0}}.arc{transform-origin:20px 21px;animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.heart{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}@keyframes beat{0%,80%,100%{transform:scale(1)}88%{transform:scale(1.45)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important;transition:none!important}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9270"/><stop offset="1" stop-color="#d8342c"/></linearGradient><clipPath id="t"><rect width="40" height="40" rx="9"/></clipPath></defs><ellipse cx="20" cy="46.5" rx="14" ry="1.8" fill="#000" opacity=".1"/><ellipse class="fl" cx="13" cy="42.5" rx="4.4" ry="2.4" fill="#d8342c" stroke="#fff" stroke-width="1.1"/><ellipse class="fr" cx="27" cy="42.5" rx="4.4" ry="2.4" fill="#d8342c" stroke="#fff" stroke-width="1.1"/><g class="fig"><rect width="40" height="40" rx="9" fill="url(#g)"/><g clip-path="url(#t)"><g class="arc"><path d="M31.3 14.5A13 13 0 1 1 26.5 9.7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M28.2 10.7 25.7 11.1 27.3 8.4z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></g><path class="heart" d="M8 10.8 5.3 8.1a1.7 1.7 0 0 1 2.7-2.1 1.7 1.7 0 0 1 2.7 2.1z" fill="#fff"/><circle cx="20" cy="21" r="8.6" fill="#fff"/><ellipse cx="16.6" cy="19.6" rx="1.4" ry="1.7" fill="#d8342c"/><ellipse cx="23.4" cy="19.6" rx="1.4" ry="1.7" fill="#d8342c"/><path d="M16.8 23.2h6.4a3.2 3.2 0 0 1-6.4 0z" fill="#d8342c"/><circle cx="14.6" cy="23" r="1" fill="#ffc2b0"/><circle cx="25.4" cy="23" r="1" fill="#ffc2b0"/></g></g><g class="load"><rect x="6" y="-13.5" width="28" height="10" rx="2.4" fill="#fff" stroke="#d8342c" stroke-width="1.1"/><text x="20" y="-8.3" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#d8342c" font-size="6.6">复盘</text><g class=""><circle cx="3" cy="-3" r="3.6" fill="#d8342c" stroke="#fff" stroke-width="1.3"/></g><g class=""><circle cx="37" cy="-3" r="3.6" fill="#d8342c" stroke="#fff" stroke-width="1.3"/></g></g><path class="sweat" d="M43 5q2.6 3.4 0 5.2-2.6-1.8 0-5.2z" fill="#6fc3ff"/></svg>