<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 68 68" style="--t:1.3"><style>.lbl{font-family:-apple-system,"PingFang SC",sans-serif;font-weight:700}.fig{transform-origin:20px 40px}.hand,.tap,.h1,.h2{transform-box:fill-box}.hand{transform-origin:center}.fig{animation:think calc(var(--t)*3s) ease-in-out infinite}@keyframes think{50%{transform:rotate(-3deg)}}.c{animation:pulse calc(var(--t)*1.6s) ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.b1{animation:pulse calc(var(--t)*1.6s) infinite}.b2{animation:pulse calc(var(--t)*1.6s) infinite .2s}.breath{transform-origin:20px 20px;animation:breath 3.6s ease-in-out infinite}@keyframes breath{50%{transform:scale(1.05)}}.k{animation:fade 3.6s ease-in-out infinite}.k2{animation-delay:.3s}.k3{animation-delay:.6s}.k4{animation-delay:.9s}@keyframes fade{0%,10%{opacity:1}40%,80%{opacity:0}100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important;transition:none!important}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc3d6"/><stop offset="1" stop-color="#d8578a"/></linearGradient><clipPath id="t"><rect width="40" height="40" rx="9"/></clipPath></defs><ellipse cx="20" cy="46.5" rx="14" ry="1.8" fill="#000" opacity=".1"/><g class="fig"><rect width="40" height="40" rx="9" fill="url(#g)"/><g clip-path="url(#t)"><g fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path class="k k1" d="M5 10V5h5"/><path class="k k2" d="M30 5h5v5"/><path class="k k3" d="M35 30v5h-5"/><path class="k k4" d="M10 35H5v-5"/></g><g class="breath"><circle cx="20" cy="20" r="10" fill="#fff"/><circle cx="16.4" cy="19.2" r="1.2" fill="#d8578a"/><circle cx="23.6" cy="19.2" r="1.2" fill="#d8578a"/><path d="M18.4 23.4q1.6 1 3.2 0" fill="none" stroke="#d8578a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.6" cy="23" r=".9" fill="#ff9fbf"/></g></g></g><g class="bub"><circle