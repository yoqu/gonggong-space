<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 68 68" style="--t:0.7"><style>.lbl{font-family:-apple-system,"PingFang SC",sans-serif;font-weight:700}.fig{transform-origin:20px 40px}.hand,.tap,.h1,.h2{transform-box:fill-box}.hand{transform-origin:center}.fig,.load{animation:heave calc(var(--t)*0.8s) ease-in-out infinite}@keyframes heave{50%{transform:translateY(1.2px)}}.fl{animation:stepl calc(var(--t)*0.8s) ease-in-out infinite}.fr{animation:stepl calc(var(--t)*0.8s) ease-in-out infinite reverse}@keyframes stepl{50%{transform:translateY(-1.8px)}}.sweat{animation:drip calc(var(--t)*1.2s) ease-in infinite}@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(5px);opacity:0}}.hop{animation:hop .6s cubic-bezier(.3,0,.5,1) infinite alternate}@keyframes hop{to{transform:translateY(-2px)}}.s{animation:green 2.4s steps(1) infinite}.s2{animation-delay:.6s}.s3{animation-delay:1.2s}@keyframes green{0%{fill:#ff5f57}25%,100%{fill:#30c85e}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important;transition:none!important}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8be07a"/><stop offset="1" stop-color="#239a3c"/></linearGradient><clipPath id="t"><rect width="40" height="40" rx="9"/></clipPath></defs><ellipse cx="20" cy="46.5" rx="14" ry="1.8" fill="#000" opacity=".1"/><ellipse class="fl" cx="13" cy="42.5" rx="4.4" ry="2.4" fill="#239a3c" stroke="#fff" stroke-width="1.1"/><ellipse class="fr" cx="27" cy="42.5" rx="4.4" ry="2.4" fill="#239a3c" stroke="#fff" stroke-width="1.1"/><g class="fig"><rect width="40" height="40" rx="9" fill="url(#g)"/><g clip-path="url(#t)"><g class="hop"><rect x="10.5" y="6.5" width="19" height="17" rx="7" fill="#fff"/><path d="M14.4 14.4q1.6-2 3.2 0M22.4 14.4q1.6-2 3.2 0" fill="none" stroke="#239a3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.4 17.4h7.2a3.6 3.6 0 0 1-7.2 0z" fill="#239a3c"/></g><path