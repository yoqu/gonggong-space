<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 68 68" style="--t:0.8"><style>.lbl{font-family:-apple-system,"PingFang SC",sans-serif;font-weight:700}.fig{transform-origin:20px 40px}.hand,.tap,.h1,.h2{transform-box:fill-box}.hand{transform-origin:center}.fig{animation:runb calc(var(--t)*0.36s) ease-in-out infinite alternate}@keyframes runb{from{transform:rotate(6deg) translateY(0)}to{transform:rotate(6deg) translateY(-2px)}}.fl{animation:kick calc(var(--t)*0.36s) ease-in-out infinite alternate}.fr{animation:kick calc(var(--t)*0.36s) ease-in-out infinite alternate-reverse}@keyframes kick{from{transform:translateX(-3px)}to{transform:translate(3px,-1.5px)}}.spd path{animation:dash calc(var(--t)*0.5s) linear infinite}.spd path:nth-child(2){animation-delay:.15s}.spd path:nth-child(3){animation-delay:.3s}@keyframes dash{from{transform:translateX(4px);opacity:0}50%{opacity:1}to{transform:translateX(-4px);opacity:0}}.bl{animation:bl 1.2s ease-in-out infinite}.br{animation:br 1.2s ease-in-out infinite}@keyframes bl{50%{transform:translateX(1.2px)}}@keyframes br{50%{transform:translateX(-1.2px)}}.c1,.c2{transform-box:fill-box;transform-origin:0 50%;animation:del 2.4s ease-in-out infinite}.c2{animation-delay:.4s}@keyframes del{0%,20%{transform:scaleX(1)}60%,80%{transform:scaleX(.25)}100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important;transition:none!important}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0a9b5"/><stop offset="1" stop-color="#39424f"/></linearGradient><clipPath id="t"><rect width="40" height="40" rx="9"/></clipPath></defs><ellipse cx="20" cy="46.5" rx="14" ry="1.8" fill="#000" opacity=".1"/><ellipse class="fl" cx="13" cy="42.5" rx="4.4" ry="2.4" fill="#39424f" stroke="#fff" stroke-width="1.1"/><ellipse class="fr" cx="27" cy="42.5" rx="4.4" ry="2.4" fill="#39424f" stroke="#fff" stroke-width="1.1"/><g class="spd" fill="none" stroke="#a0a9