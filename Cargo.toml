[workspace]
resolver = "3"
members = ["crates/gonggong", "apps/desktop/src-tauri"]
# B0 spike: libwebrtc is a ~277 MB download, kept out of the main build until it is adopted.
exclude = ["crates/gg-cast"]

# Shared by the daemon and the desktop app; members opt in with `x.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tracing = "0.1.44"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
