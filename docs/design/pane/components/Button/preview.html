<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:150px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col'},
 h('div',{className:'row'}, h(P.Button,{variant:'primary'},'存储'), h(P.Button,null,'取消'), h(P.Button,{variant:'destructive'},'移到废纸篓'), h(P.Button,{variant:'plain'},'了解更多…'), h(P.Button,{disabled:true},'不可用')),
 h('div',{className:'row'}, h(P.Button,{size:'small'},'小号'), h(P.Button,null,'常规'), h(P.Button,{size:'large'},'大号'), h(P.Button,{size:'xlarge',variant:'primary'},'继续'), h(P.Button,{icon:'plus','aria-label':'添加'}), h(P.Button,{icon:'share'},'共享'))))
</script>
</body>
</html>
