<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sidebar</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:0;min-height:330px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>

<body>
<div id="root" class="pn pn-surface"></div>
<script>

ReactDOM.createRoot(document.getElementById('root')).render(h(P.Sidebar,{style:{height:'290px'},defaultSelected:'recents',sections:[{title:'个人收藏',items:[{id:'recents',label:'最近使用',icon:'clock',color:'var(--system-blue)'},{id:'desktop',label:'桌面',icon:'desktop',color:'var(--system-indigo)'},{id:'docs',label:'文稿',icon:'doc',color:'var(--system-orange)'},{id:'dl',label:'下载',icon:'download',color:'var(--system-green)',badge:3}]},{title:'位置',items:[{id:'icloud',label:'iCloud 云盘',icon:'cloud',color:'var(--system-cyan)'}]},{title:'标签',items:[{id:'fav',label:'重要',icon:'star',color:'var(--system-yellow)'},{id:'tag',label:'工作',icon:'tag',color:'var(--system-purple)'}]}]}))
</script>
</body>
</html>
