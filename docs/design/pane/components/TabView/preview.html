<!doctype html>
<html>
<head><meta charset="utf-8"><title>TabView</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:220px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(P.TabView,{tabs:[{value:'g',label:'通用',content:h(P.GroupBox,null,h(P.GroupRow,{label:'启动时打开'},h(P.Switch,{defaultChecked:true,'aria-label':'启动时打开'})),h(P.GroupRow,{label:'默认浏览器'},h(P.PopUpButton,{options:[{value:'s',label:'Safari'},{value:'o',label:'其他'}]})))},{value:'a',label:'账户',content:h('div',null,'账户设置')},{value:'x',label:'高级',content:h('div',null,'高级设置')}]}))
</script>
</body>
</html>
