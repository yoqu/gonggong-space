<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:150px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{alignItems:'flex-start',gap:'24px'}}, h(P.TextField,{label:'电脑名称',defaultValue:'Yoqu 的 MacBook Pro',hint:'局域网中的设备会看到这个名称。'}), h(P.TextField,{label:'电子邮件',placeholder:'name@example.com',error:'请输入有效的电子邮件地址'})))
</script>
</body>
</html>
