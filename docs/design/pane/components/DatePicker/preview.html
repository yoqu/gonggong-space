<!doctype html>
<html>
<head><meta charset="utf-8"><title>DatePicker</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--content-bg)} #root{padding:20px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn "></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{alignItems:'flex-start',gap:'24px'}}, h(P.DatePicker,{label:'开始日期',defaultValue:'2026-10-08',defaultOpen:true,marks:['2026-10-09','2026-10-15']}), h(P.DatePicker,{label:'截止日期',placeholder:'选择截止日期'})))
</script>
</body>
</html>
