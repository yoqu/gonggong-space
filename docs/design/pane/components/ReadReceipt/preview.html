<!doctype html>
<html>
<head><meta charset="utf-8"><title>ReadReceipt</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--content-bg)} #root{padding:20px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn "></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{gap:'20px'}}, [[0,5,'全部未读'],[2,5,'部分已读'],[5,5,'全部已读'],[1,1,'单聊已读']].map(function(x){return h('span',{key:x[2],className:'row',style:{gap:'6px',fontSize:'12px',color:'var(--label-secondary)'}},h(P.ReadReceipt,{read:x[0],total:x[1]}),x[2]);})))
</script>
</body>
</html>
