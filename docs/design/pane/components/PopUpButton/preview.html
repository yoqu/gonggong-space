<!doctype html>
<html>
<head><meta charset="utf-8"><title>PopUpButton</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:260px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{alignItems:'flex-start',gap:'24px'}}, h(P.PopUpButton,{defaultOpen:true,defaultValue:'name',options:[{value:'none',label:'无'},{value:'name',label:'名称'},{value:'kind',label:'种类'},{value:'date',label:'修改日期'},{value:'size',label:'大小'}]}), h(P.PopUpButton,{options:[{value:'1',label:'每天'},{value:'7',label:'每周'}]})))
</script>
</body>
</html>
