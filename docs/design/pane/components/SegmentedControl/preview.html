<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:110px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col'}, h('div',{className:'row'}, h(P.SegmentedControl,{'aria-label':'时间范围',items:[{value:'d',label:'日'},{value:'w',label:'周'},{value:'m',label:'月'},{value:'y',label:'年'}],defaultValue:'w'})),
 h('div',{className:'row'}, h(P.SegmentedControl,{'aria-label':'显示方式',size:'small',items:[{value:'grid',icon:'grid','aria-label':'图标'},{value:'list',icon:'list','aria-label':'列表'}]}), h(P.SegmentedControl,{size:'large',items:[{value:'a',label:'浅色'},{value:'b',label:'深色'},{value:'c',label:'自动'}],defaultValue:'c'}))))
</script>
</body>
</html>
