<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProgressIndicator</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:60px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{gap:'24px'}}, h(P.ProgressIndicator,{value:64,'aria-label':'下载进度'}), h(P.ProgressIndicator,{'aria-label':'正在准备'}), h(P.ProgressIndicator,{variant:'spinner'})))
</script>
</body>
</html>
