<!doctype html>
<html>
<head><meta charset="utf-8"><title>Calendar</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{alignItems:'flex-start',gap:'28px'}},
 h('div',{style:{padding:'12px',borderRadius:'12px',background:'var(--content-bg)',boxShadow:'inset 0 0 0 1px var(--separator)'}},h(P.Calendar,{defaultValue:'2026-10-08',marks:['2026-10-08','2026-10-09','2026-10-15','2026-10-22'],min:'2026-10-01'})),
 h('div',{style:{padding:'12px',borderRadius:'12px',background:'var(--content-bg)',boxShadow:'inset 0 0 0 1px var(--separator)'}},h(P.Calendar,{defaultValue:'2026-09-25'}))))
</script>
</body>
</html>
