<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title>
<style>html,body{margin:0;min-height:100%} body{background:var(--window-bg)} #root{padding:20px;min-height:110px;box-sizing:border-box} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div id="root" class="pn pn-surface"></div>
<script>
var P = window.Pane, h = React.createElement;
var names=P.Icon.names; ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{gap:'18px',color:'var(--label)'}}, names.map(function(n){return h('div',{key:n,title:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',width:'56px'}},h(P.Icon,{name:n,size:20}),h('span',{style:{fontSize:'10px',color:'var(--label-secondary)'}},n));})))
</script>
</body>
</html>
